name: Inspect Expo Launch diagnostics

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Query recent EAS builds for BLACKSPOT YOU
        shell: bash
        run: |
          set -euo pipefail
          cat > payload.json <<'JSON'
          {
            "query": "query ViewBuildsOnApp($appId: String!, $offset: Int!, $limit: Int!) { app { byId(appId: $appId) { id name slug ownerAccount { name } builds(offset: $offset, limit: $limit) { id status platform buildProfile appIdentifier sdkVersion appVersion appBuildVersion gitCommitHash gitCommitMessage message createdAt updatedAt completedAt error { errorCode message docsUrl } artifacts { buildUrl xcodeBuildLogsUrl buildArtifactsUrl applicationArchiveUrl } logFiles } } } }",
            "variables": {
              "appId": "fbd1b684-c8fe-49be-adfa-790e87d521e3",
              "offset": 0,
              "limit": 20
            }
          }
          JSON

          http_code="$(curl -sS -o response.json -w '%{http_code}' \
            -H 'Content-Type: application/json' \
            --data-binary @payload.json \
            https://api.expo.dev/graphql)"
          echo "HTTP $http_code"
          python3 -m json.tool response.json || cat response.json
