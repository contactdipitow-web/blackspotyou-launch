name: Inspect Expo Launch diagnostics

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect Launch browser error handling
        shell: bash
        run: |
          set -euo pipefail
          mkdir inspect && cd inspect

          mkdir -p site
          curl -fsSL https://launch.expo.dev/ -o site/index.html
          grep -oE '(src|href)="[^"]+\.(js|mjs)(\?[^"]*)?"' site/index.html \
            | sed -E 's/^(src|href)="//; s/"$//' \
            | sort -u > site/assets.txt || true

          while IFS= read -r asset; do
            [ -n "$asset" ] || continue
            case "$asset" in
              http*) url="$asset" ;;
              /*) url="https://launch.expo.dev$asset" ;;
              *) url="https://launch.expo.dev/$asset" ;;
            esac
            file="site/$(echo "$asset" | sed 's#[/?&=]#_#g')"
            curl -fsSL "$url" -o "$file" || true
          done < site/assets.txt

          echo '=== exact user-facing error ==='
          grep -RniF -C 3 'Unknown custom build error' site || true
          grep -RniF -C 3 'See logs for more information' site || true

          echo '=== related status/error tokens ==='
          grep -RniE -C 2 'CUSTOM_BUILD|customBuild|custom-build|custom build|workflowStatus|dashboardUrl|build logs' site \
            | head -n 1200 || true
