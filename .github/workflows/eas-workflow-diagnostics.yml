name: EAS workflow diagnostics

on:
  push:
    branches:
      - diagnostic/eas-workflow-logs

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install project dependencies
        run: npm ci --no-audit --no-fund
      - name: Inspect current TestFlight workflow
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx --yes eas-cli@latest workflow:view 01a05401-7045-7ba8-9906-205b4a1c769b --json --non-interactive
      - name: Read current TestFlight upload logs
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx --yes eas-cli@latest workflow:logs 01a05401-7236-7dbf-baf9-8f94c6a111ce --json --non-interactive --all-steps
      - name: Snapshot marker
        run: echo "Refreshed TestFlight state after App Store Connect upload began."
