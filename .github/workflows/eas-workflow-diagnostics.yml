name: EAS workflow diagnostics

on:
  push:
    branches:
      - diagnostic/eas-workflow-logs

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Query completed TestFlight workflow state
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          node <<'NODE'
          const token = process.env.EXPO_TOKEN;
          if (!token) throw new Error('EXPO_TOKEN missing');
          const query = `query WorkflowRunById($workflowRunId: ID!) { workflowRuns { byId(workflowRunId: $workflowRunId) { id status jobs { id key name status errors { title message } outputs } } } }`;
          const response = await fetch('https://api.expo.dev/graphql', {
            method: 'POST',
            headers: { 'content-type': 'application/json', authorization: `Bearer ${token}` },
            body: JSON.stringify({ query, variables: { workflowRunId: '01a05401-7045-7ba8-9906-205b4a1c769b' } }),
          });
          const json = await response.json();
          if (!response.ok || json.errors) throw new Error(JSON.stringify(json.errors || json));
          console.log(JSON.stringify(json.data.workflowRuns.byId, null, 2));
          NODE
