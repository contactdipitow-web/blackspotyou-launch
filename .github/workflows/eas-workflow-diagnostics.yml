name: EAS workflow diagnostics

on:
  push:
    branches:
      - diagnostic/eas-workflow-logs

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install project dependencies
        run: npm ci --no-audit --no-fund
      - name: Check Expo token availability
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::EXPO_TOKEN repository secret is not configured."
            exit 1
          fi
          echo "EXPO_TOKEN is configured."
      - name: Connect App Store Connect app by bundle id
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_DEBUG: "1"
        run: npx --yes eas-cli@latest integrations:asc:connect --bundle-id com.blackspotyou.app --json --non-interactive
      - name: Confirm App Store Connect integration
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx --yes eas-cli@latest integrations:asc:status --json --non-interactive
