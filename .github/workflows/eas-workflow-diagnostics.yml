name: EAS workflow diagnostics

on:
  push:
    branches:
      - diagnostic/eas-workflow-logs

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install project dependencies
        run: npm ci --no-audit --no-fund
      - name: Check Expo token availability
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::EXPO_TOKEN repository secret is not configured."
            exit 1
          fi
          echo "EXPO_TOKEN is configured."
      - name: Inspect EAS TestFlight workflow final state
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx --yes eas-cli@latest workflow:view 01a053f9-ea7e-7d45-8bfa-6e401837415e --json --non-interactive
      - name: Read final EAS TestFlight job logs
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx --yes eas-cli@latest workflow:logs 01a053f9-ec4b-700d-a665-391092621e0b --json --non-interactive --all-steps
