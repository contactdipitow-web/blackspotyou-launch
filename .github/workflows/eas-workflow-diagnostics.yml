name: EAS workflow diagnostics

on:
  push:
    branches:
      - diagnostic/eas-workflow-logs

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install project dependencies
        run: npm ci --no-audit --no-fund
      - name: Link BLACKSPOT YOU to App Store Connect
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx --yes eas-cli@latest integrations:asc:connect --api-key-id KFVDVXHWU2 --asc-app-id 6806782781 --bundle-id com.blackspotyou.app --json --non-interactive
      - name: Confirm App Store Connect integration
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx --yes eas-cli@latest integrations:asc:status --json --non-interactive
