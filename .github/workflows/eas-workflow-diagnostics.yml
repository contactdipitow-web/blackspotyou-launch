name: EAS workflow diagnostics

on:
  push:
    branches:
      - diagnostic/eas-workflow-logs

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install project dependencies
        run: npm ci --no-audit --no-fund
      - name: Check Expo token availability
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::EXPO_TOKEN repository secret is not configured."
            exit 1
          fi
          echo "EXPO_TOKEN is configured."
      - name: Inspect failed EAS workflow
        if: success()
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx --yes eas-cli@latest workflow:view 01a053c7-5d82-7399-a93f-3839c3a7ac68 --json --non-interactive
      - name: Read failed EAS workflow logs
        if: success()
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx --yes eas-cli@latest workflow:logs 01a053c7-5d82-7399-a93f-3839c3a7ac68 --json --non-interactive --all-steps
