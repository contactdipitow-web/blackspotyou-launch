name: Expo preflight

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate Expo Launch production profile
        run: |
          node <<'NODE'
          const config = require('./eas.json');
          const production = config?.build?.production;
          if (!production || Object.keys(production).length === 0) {
            throw new Error('eas.json build.production must be explicit and non-empty for Expo Launch');
          }
          if (production.distribution !== 'store') {
            throw new Error('eas.json build.production.distribution must be "store"');
          }
          if (production.environment !== 'production') {
            throw new Error('eas.json build.production.environment must be "production"');
          }
          if (!production.ios || typeof production.ios !== 'object') {
            throw new Error('eas.json build.production.ios must be explicitly configured');
          }
          console.log('Expo Launch production profile is explicit and valid.');
          NODE

      - name: Resolve Expo config
        run: npx expo config --type public >/dev/null

      - name: Expo Doctor
        run: npx expo-doctor

      - name: TypeScript
        run: npm run typecheck

      - name: Generate native iOS project
        run: npx expo prebuild --platform ios --clean --no-install
