name: Expo repository preflight

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Show resolved native versions
        run: |
          node -e "for (const p of ['expo','expo-modules-core','react-native','react-native-worklets','react-native-reanimated','expo-router','react-native-screens']) { try { console.log(p, require(p + '/package.json').version) } catch (e) { console.log(p, 'NOT_INSTALLED') } }"
          npm ls expo expo-modules-core react-native react-native-worklets react-native-reanimated expo-router react-native-screens || true

      - name: Expo Doctor
        run: npx expo-doctor

      - name: TypeScript
        run: npm run typecheck

      - name: Generate native iOS project
        run: npx expo prebuild --platform ios --clean --no-install
