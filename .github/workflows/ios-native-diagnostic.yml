name: iOS native build diagnostic

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile-ios:
    runs-on: macos-26
    timeout-minutes: 90
    env:
      CI: "1"
      EXPO_PUBLIC_SUPABASE_URL: https://zyreqzldpfmdjvazkqvn.supabase.co
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_v3OZAz3x64nuCCsHuSBCHQ_nimguGro
      EXPO_PUBLIC_WEB_URL: https://blackspotyou.com
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund

      - name: Show Apple toolchain
        run: |
          xcodebuild -version
          pod --version

      - name: Generate native iOS project
        run: npx expo prebuild --platform ios --clean --no-install

      - name: Install CocoaPods
        run: |
          cd ios
          pod install --repo-update

      - name: Discover workspace and scheme
        id: native
        run: |
          set -euo pipefail
          WORKSPACE="$(find ios -maxdepth 1 -name '*.xcworkspace' -print -quit)"
          if [ -z "$WORKSPACE" ]; then
            echo "No .xcworkspace generated" >&2
            exit 1
          fi
          SCHEME="$(xcodebuild -workspace "$WORKSPACE" -list -json | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d["workspace"]["schemes"][0])')"
          echo "workspace=$WORKSPACE" >> "$GITHUB_OUTPUT"
          echo "scheme=$SCHEME" >> "$GITHUB_OUTPUT"
          echo "Workspace: $WORKSPACE"
          echo "Scheme: $SCHEME"

      - name: Compile Release for iOS Simulator without signing
        run: |
          set -o pipefail
          xcodebuild \
            -workspace "${{ steps.native.outputs.workspace }}" \
            -scheme "${{ steps.native.outputs.scheme }}" \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build | tee xcodebuild.log

      - name: Upload diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-native-diagnostic-log
          path: xcodebuild.log
          if-no-files-found: ignore
          retention-days: 3
